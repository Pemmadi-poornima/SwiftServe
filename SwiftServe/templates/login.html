<!DOCTYPE html>
<html>
<head>
    <title>Login - SwiftServe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-card">
        <h2>Student Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Student ID / Name" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <p style="margin-top:15px;">New here? <a href="/register">Register</a></p>
    </div>
</body>
</html>
